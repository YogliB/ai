goal: '{{clear statement of what this plan achieves - one repo, one PR; multi-repo or multi-PR work uses masterplan.yaml plus one plan per PR}}'
files:
    - 'path/to/file'
    - 'path/to/other'
context: '{{inlined facts required to implement without opening other docs or chat history: schemas, field mappings, API shapes, flag names, env vars, verified current before/after snippets, cross-service contracts, verification commands. No pointer-only entries. Every file path and line number must be re-checked against the repo before finalizing.}}'
scope:
    in:
        - '{{what is included}}'
    out:
        - '{{what is explicitly excluded}}'
risks:
    - risk: '{{risk 1}}'
      mitigation: '{{mitigation}}'
dependencies:
    - '{{dep 1}}'
priority: '{{High / Medium / Low}}'
logging_observability:
    - '{{log point 1}}'
    - '{{metric 1}}'
branch_setup: '{{branch prefix {branch-prefix} = team, git user, or operator convention (git config user.name / gh api user -q .login sanitized lowercase, or feature/ fix/). Name the branch after the work - short kebab-case slug, not a ticket or issue ID. Steps: git checkout main, git pull, git checkout -b {branch-prefix}/<short-meaningful-name>}}'
implementation_todos:
    - action: '{{step 1 name}}'
      verify: '{{how to verify}}'
      subtasks:
          - action: '{{task 1.1}}'
            verify: '{{how to verify}}'
    - action: '{{step 2 name}}'
      verify: '{{how to verify}}'
delivery: "{{commit on the feature branch with a message reflecting this plan's scope (only when policy allows commits); push the feature branch (only when policy or PR flow requires a remote branch)}}"
docs:
    - document: '{{document 1}}'
      path: '{{file path or description}}'
testing:
    - '{{verification / validation steps}}'
    - '{{new or changed tests follow repository conventions (for example backend non-UI: when_<condition>_then_<outcome> names where that rule exists)}}'
    - '{{unit tests}}'
    - '{{integration tests}}'
verification:
    - '{{exercise the feature end-to-end the way a user or agent will hit it}}'
acceptance:
    - '{{acceptance criterion 1}}'
fallback_plan: '{{what to do if the plan fails or causes issues}}'
references: "{{optional source attribution only - every fact needed for execution must already appear under context, scope, implementation_todos, or acceptance. Write 'None' when nothing to attribute.}}"
complexity_check:
    todos: '{{N - items under implementation_todos only; >30 triggers the snail-planning split rule}}'
    depth: '{{N - nesting under implementation_todos only; keep at 2 or less}}'
    cross_deps: '{{N - informational for the proceed/split narrative}}'
    high_risks: '{{N - informational}}'
    decision: '{{proceed / split}}'
