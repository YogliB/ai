name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Test receipt scripts
              run: sh scripts/test-receipts.sh
            - name: Test plan lint
              run: sh scripts/test-lint-plan.sh
            - name: Test flow state machine
              run: sh scripts/test-flow-state.sh
            - name: Test sync script
              run: sh scripts/test-sync-devin-plugin.sh
            - name: Check plugin copies are in sync
              run: sh scripts/sync-devin-plugin.sh --check
            - name: Test skills index script
              run: sh scripts/test-gen-skills-index.sh
            - name: Check skills index is up to date
              run: sh scripts/gen-skills-index.sh --check
    claude-plugin:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - name: Test Claude Code plugin install
              run: sh scripts/test-claude-plugin.sh
