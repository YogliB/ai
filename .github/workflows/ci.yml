name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - name: Run the test suite
              run: npm test
            - name: Check plugin copies are in sync
              run: node scripts/sync-devin-plugin.mjs --check
            - name: Check skills index is up to date
              run: node scripts/gen-skills-index.mjs --check
            - name: Check vendored js-yaml is up to date
              run: node scripts/vendor-js-yaml.mjs --check
    claude-plugin:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Test Claude Code plugin install
              run: node --test tests/claude-plugin.test.mjs
              env:
                  CLAUDE_PLUGIN_TEST: 1
